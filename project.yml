name: Fanyi
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Fanyi:
    type: application
    platform: macOS
    sources: [Sources, Resources]
    dependencies:
      - package: Sparkle
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 翻译神器
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSHumanReadableCopyright: ""
        # 自动更新（Sparkle）：更新信息放在 GitHub Pages 主页，安装包在 GitHub Release
        SUFeedURL: https://tianyaphoto.github.io/fanyi/appcast.xml
        SUPublicEDKey: xAKDG7ymGAvqy8jrceLh/Z9KuLf5VT3L7SnPKwoJOm0=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # 发现新版后台自动下载；空闲时静默安装并重启（见 Sources/Updater.swift），退出时也会装
        SUAutomaticallyUpdate: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.fanyi
        PRODUCT_NAME: Fanyi
        MARKETING_VERSION: "1.6"
        CURRENT_PROJECT_VERSION: "7"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
