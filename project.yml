name: Fanyi
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
targets:
  Fanyi:
    type: application
    platform: macOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 翻译神器
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.fanyi
        PRODUCT_NAME: Fanyi
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
