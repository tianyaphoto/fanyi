<h3>翻译神器 1.3</h3>
<ul>
  <li><b>多种语言</b>：默认还是中英互译；在设置里可以任选两种语言（共 16 种），比如越南语 ⇄ 英语、英语 ⇄ 韩语、日语 ⇄ 中文。两种语言互相翻译，其他语言都译成主要语言。</li>
  <li><b>临时换目标语言</b>：浮窗里的「→ 语言」按钮可以只为这一次翻译换成别的语言。</li>
  <li><b>截图识别更准</b>：自动判断文字语言，中英混排、中文界面的截图不再乱码；也能识别设置里选的语言（如韩文、越南文）。</li>
  <li>可以用 Homebrew 安装：brew install --cask tianyaphoto/tap/fanyi</li>
</ul>
